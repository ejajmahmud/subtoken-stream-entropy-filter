[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subtoken-stream-entropy-filter"
version = "0.1.0"
description = "Real-time token entropy monitor identifying hallucination drift and reasoning degeneration in streaming model generations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
subtoken-stream-entropy-filter = "subtoken_stream_entropy_filter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["subtoken_stream_entropy_filter*"]
